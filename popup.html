<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 280px;
      padding: 12px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover { background: #3367d6; }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
      white-space: pre-line;
    }
    .login-section {
      margin-bottom: 12px;
    }
    .login-section label {
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
      color: #333;
    }
    .login-section input {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    .login-section input:focus {
      outline: none;
      border-color: #4285f4;
    }
    .user-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 6px 8px;
      background: #e8f5e9;
      border-radius: 4px;
      font-size: 12px;
      color: #2e7d32;
    }
    .user-info span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }
    #logoutBtn {
      background: none;
      border: none;
      color: #d32f2f;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      width: auto;
    }
    #logoutBtn:hover {
      text-decoration: underline;
      background: none;
    }
    #loginError {
      font-size: 12px;
      color: #d32f2f;
      margin-bottom: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Login Section (shown when not logged in) -->
  <div id="loginSection" class="login-section">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="your-email@gmail.com">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password">
    <div id="loginError"></div>
    <button id="loginBtn">Login</button>
  </div>

  <!-- Logged-in Section (shown when logged in) -->
  <div id="loggedInSection" style="display: none;">
    <div class="user-info">
      <span id="userEmail"></span>
      <button id="logoutBtn">Logout</button>
    </div>
    <button id="fillBtn">Fill Form</button>
  </div>

  <div id="status"></div>
  <script src="content.js"></script>
  <script src="popup.js"></script>
</body>
</html>
