<!DOCTYPE html>
<html>
<head>
  <title>Form Filler Test Page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 40px auto; }
    label { display: block; margin-top: 12px; font-weight: 500; }
    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box;
    }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>Test Form</h2>
  <form>
    <label for="firstName">First Name</label>
    <input type="text" id="firstName">

    <label for="lastName">Last Name</label>
    <input type="text" id="lastName">

    <label for="email">Email</label>
    <input type="email" id="email">

    <label for="phone">Phone</label>
    <input type="tel" id="phone">

    <div class="checkbox-row">
      <input type="checkbox" id="agreeTerms">
      <label for="agreeTerms">I agree to the terms</label>
    </div>
  </form>
</body>
</html>
