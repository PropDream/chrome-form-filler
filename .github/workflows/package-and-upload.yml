name: Package and Upload to S3

on:
  push:
    branches: [main]

jobs:
  package-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: version
        run: echo "VERSION=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Create ZIP
        run: zip "chrome-form-filler-v${{ steps.version.outputs.VERSION }}.zip" manifest.json background.js content.js popup.html popup.js README.md icon16.png icon48.png icon128.png

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 cp "chrome-form-filler-v${{ steps.version.outputs.VERSION }}.zip" "s3://proply-data/chrome-form-filler/chrome-form-filler-v${{ steps.version.outputs.VERSION }}.zip"
          aws s3 cp "chrome-form-filler-v${{ steps.version.outputs.VERSION }}.zip" "s3://proply-data/chrome-form-filler/chrome-form-filler-latest.zip"
