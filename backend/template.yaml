AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Backend API for Chrome Form Filler - fetches form data from proply-backend

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x

Resources:
  GetFormDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: src/
      Environment:
        Variables:
          PROPLY_DOWNLOAD_URL: "http://proply-backend-alb-1624948625.us-west-1.elb.amazonaws.com/files/download"
      Events:
        GetFormData:
          Type: HttpApi
          Properties:
            Path: /form-data
            Method: POST
            ApiId: !Ref FormDataApi

  FormDataApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${FormDataApi}.execute-api.${AWS::Region}.amazonaws.com/form-data"
